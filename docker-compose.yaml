version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - MONGO_URL=mongodb://mongodb:27017/AI_Finance
      - CLERK_JWKS_URL=${CLERK_JWKS_URL}
      - TESSERACT_PATH=tesseract
      - WKHTMLTOPDF_PATH=wkhtmltopdf
    depends_on:
      - mongodb
    networks:
      - finance-network

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - finance-network

networks:
  finance-network:
    driver: bridge

volumes:
  mongodb_data:
